name: e2e-test
on: [push]

jobs:
  test:
    runs-on: [self-hosted, linux, x64, orbai]
    steps:
      - name: Check runner env
        run: |
          echo "=== whoami ==="
          whoami
          echo "=== hostname ==="
          hostname
          echo "=== docker version ==="
          docker version --format 'server:{{.Server.Version}}'
          echo "=== docker hello-world via harbor proxy ==="
          docker pull harbor.frp.orbai.cn/dockerhub/library/hello-world:latest
          echo "=== disk ==="
          df -h / | tail -1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show repo
        run: ls -la